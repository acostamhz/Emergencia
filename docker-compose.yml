services:
  postgres:
    image: postgres:17
    container_name: emergencia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: emergencia
      POSTGRES_PASSWORD: emergencia123
      POSTGRES_DB: emergencia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: